name: build-video
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yt-dlp, ffmpeg, and deno
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg jq unzip
          pip install yt-dlp
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
      - name: Write cookies file
        run: echo "${{ secrets.YT_COOKIES }}" > cookies.txt
      - name: Get direct URLs and normalize each video
        run: |
          mkdir -p normalized
          > concat_list.txt
          i=0
          while read -r LINK; do
            [ -z "$LINK" ] && continue
            i=$((i+1))
            echo "Fetching and normalizing video $i: $LINK"
            DIRECT_URL=$(yt-dlp --cookies cookies.txt --remote-components ejs:github -f "best[height<=1080]" -g "$LINK")
            ffmpeg -y -i "$DIRECT_URL" -an \
              -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,setsar=1" \
              -c:v libx264 -preset veryfast -pix_fmt yuv420p \
              "normalized/video_${i}.mp4"
            echo "file 'video_${i}.mp4'" >> concat_list.txt
          done < video_links.txt
          cat concat_list.txt
      - name: Stitch videos into one file
        run: |
          cd normalized
          ffmpeg -y -f concat -safe 0 -i ../concat_list.txt -c copy final_stream.mp4
          mv final_stream.mp4 ../final_stream.mp4
      - name: Commit final video to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git lfs track "final_stream.mp4"
          git add .gitattributes final_stream.mp4
          git commit -m "Update stitched stream video"
          git push
