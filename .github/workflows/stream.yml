name: stream
on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: twitch-stream
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Install git-lfs and ffmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg git-lfs
          git lfs pull
      - name: Stream pre-built video on loop with background music
        run: |
          ffmpeg -re -stream_loop -1 -i final_stream.mp4 \
            -stream_loop -1 -f concat -safe 0 -i playlist.txt \
            -map 0:v -map 1:a \
            -c:v libx264 -preset veryfast -b:v 3000k -maxrate 3000k -bufsize 6000k \
            -pix_fmt yuv420p -g 60 -c:a aac -b:a 128k \
            -f tee -map 0:v -map 1:a \
            "[f=flv:onfail=ignore]rtmp://live.twitch.tv/app/${{ secrets.TWITCH_KEY }}|[f=flv:onfail=ignore]rtmp://a.rtmp.youtube.com/live2/${{ secrets.YOUTUBE_KEY }}"
