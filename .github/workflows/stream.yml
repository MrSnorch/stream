name: stream
on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: twitch-stream
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Install git-lfs and ffmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg git-lfs
          git lfs pull
      - name: Create YouTube live broadcast
        env:
          STREAM_TITLE: "Before You Buy Soulbound: Online on Steam, Read Its Background in the Description 👇"
          STREAM_DESCRIPTION: |
            Never TRUST the developers of "Soulbound: Online". Their only goal is to steal your TIME and MONEY just like they did with their FAILED CRYPTO SCAMS. Stay vigilant and check the facts - https://www.reddit.com/r/MMORPG/comments/1tn4gd6/before_you_wishlist_soulbound_online_on_steam/ 👈

            "Soulbound: Online" was previously known as "Worldwide Webb" — a failed crypto project created by Thomas Webb that has now been in active development for over 6 years.

            Over the years, the project raised millions of dollars from players and investors through NFTs, crypto marketing, and investment funding, only to end up as an unfinished, bug-filled product that was later quietly rebranded as "Soulbound: Online" before coming to Steam.

            The developers spent years making empty promises, censoring criticism, going silent, changing direction, and abandoning the community that originally funded the project.

            Now, trapped in endless development driven by sloppy vibecoding and plagued by constant server lag and game-breaking bugs, the project is heading straight toward yet another inevitable wipe — the third one — slated right upon leaving Early Access a year from now.
        run: |
          pip install requests --break-system-packages -q
          python3 create_youtube_stream.py \
            "${{ secrets.YOUTUBE_CLIENT_ID }}" \
            "${{ secrets.YOUTUBE_CLIENT_SECRET }}" \
            "${{ secrets.YOUTUBE_REFRESH_TOKEN }}" \
            "$STREAM_TITLE" \
            "$STREAM_DESCRIPTION"
      - name: Stream pre-built video on loop with background music
        run: |
          YT_RTMP=$(cat yt_rtmp_url.txt)
          ffmpeg -re -stream_loop -1 -i final_stream.mp4 \
            -stream_loop -1 -f concat -safe 0 -i playlist.txt \
            -map 0:v -map 1:a \
            -c:v libx264 -preset veryfast -b:v 6000k -maxrate 6000k -bufsize 12000k \
            -pix_fmt yuv420p -g 60 -c:a aac -b:a 128k \
            -f tee \
            "[f=flv:onfail=ignore]rtmp://live.twitch.tv/app/${{ secrets.TWITCH_KEY }}|[f=flv:onfail=ignore]${YT_RTMP}"
