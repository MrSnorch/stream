name: stream
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: twitch-stream
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Stream
        run: |
          ffmpeg -re -loop 1 -i picture.png -stream_loop -1 -f concat -safe 0 -i playlist.txt \
            -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2" \
            -c:v libx264 -preset veryfast -b:v 3000k -maxrate 3000k -bufsize 6000k \
            -pix_fmt yuv420p -g 60 -c:a aac -b:a 128k \
            -f flv rtmp://live.twitch.tv/app/${{ secrets.TWITCH_KEY }}
